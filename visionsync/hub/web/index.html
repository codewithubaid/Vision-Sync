<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VisionSync</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/assets/vs.css">
<style>
  /* Stand-alone page: the same widgets and the same positions as the MagicMirror layout. */
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden; cursor: none; }
  .stage {
    position: fixed; inset: 0; z-index: 1; padding: min(4.2vw, 6vh);
    display: grid; grid-template-columns: 1fr auto 1fr; grid-template-rows: auto minmax(0, 1fr) auto;
    column-gap: 2vw;
  }
  #status   { grid-column: 1; grid-row: 1; justify-self: start; }
  #clock    { grid-column: 2; grid-row: 1; }
  #weather  { grid-column: 3; grid-row: 1; justify-self: end; }
  #assistant{ grid-column: 1 / 4; grid-row: 2; justify-self: center; align-self: end; margin-bottom: 2vh; }
  #calendar { grid-column: 1 / 3; grid-row: 3; align-self: end; }
  .side     { grid-column: 3; grid-row: 3; justify-self: end; align-self: end; display: flex; flex-direction: column; align-items: flex-end; }
  @media (orientation: portrait) {
    .stage { grid-template-columns: 1fr 1fr; grid-template-rows: auto auto minmax(0, 1fr) auto; row-gap: 3vh; }
    #clock { grid-column: 1 / 3; grid-row: 1; }
    #status { grid-column: 1; grid-row: 2; }
    #weather { grid-column: 2; grid-row: 2; }
    #assistant { grid-column: 1 / 3; grid-row: 3; }
    #calendar { grid-column: 1 / 3; grid-row: 4; }
    .side { grid-column: 2; grid-row: 4; }
  }
</style>
</head>
<body>
<div id="ambient"></div>
<div class="stage">
  <div id="status"></div><div id="clock"></div><div id="weather"></div>
  <div id="assistant"></div>
  <div id="calendar"></div><div class="side"><div id="agenda"></div><div id="guard"></div></div>
</div>
<div id="setup"></div>
<div id="alerts"></div>
<script src="/assets/vs-qr.js"></script>
<script src="/assets/vs-widgets.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var opts = {
    timeFormat: q.get("time") === "24" ? 24 : 12,
    alarmSound: q.get("alarm") || "offline",
    ambient: q.get("ambient") || null,          // off | subtle | vivid (default comes from .env)
    maxEvents: parseInt(q.get("events") || "5", 10)
  };
  var widgets = VSWidgets.types.map(function (t) { return VSWidgets.mount(t, document.getElementById(t), opts); });
  var state = null;
  function push() { VSWidgets.applyThrottle(state); widgets.forEach(function (w) { w.update(state); }); }

  function connect() {
    var es = new EventSource("/api/stream");
    es.onmessage = function (e) { state = JSON.parse(e.data); push(); };
    es.onerror = function () {
      // Hub stopped: keep the last data, mark it old, and keep trying.
      es.close();
      state = Object.assign({}, state || {}, { _link: false });
      push();
      setTimeout(connect, 2000);
    };
  }
  push();
  connect();
})();
</script>
</body>
</html>
